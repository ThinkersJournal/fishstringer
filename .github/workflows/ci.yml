name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --all-features --no-fail-fast

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - run: cargo doc --workspace --no-deps --all-features

  # `fishstringer-slang-emit`'s slangc-gated test and its `convert` feature. slangc is the Slang project's own
  # release, pinned by version AND sha256 (the digest GitHub records for the asset; re-computed by hand from a
  # download on 2026-10-30, identical). The test is fatal without slangc because FISHSTRINGER_REQUIRE_SLANGC is set.
  slang-emit:
    name: fishstringer-slang-emit (pinned slangc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install pinned slangc (runner provisioning)
        shell: bash
        run: |
          set -euo pipefail
          v=2026.20
          sha=e863e568c204810d6e8bc31852f056aef6763c55ea9925db2db7affa060347c9
          curl -fsSL -o slang.tar.gz "https://github.com/shader-slang/slang/releases/download/v${v}/slang-${v}-linux-x86_64.tar.gz"
          echo "${sha}  slang.tar.gz" | sha256sum -c -
          mkdir slang && tar xzf slang.tar.gz -C slang
          echo "$PWD/slang/bin" >> "$GITHUB_PATH"
      - name: slangc runs and is the pinned version
        shell: bash
        run: slangc -v 2>&1 | tee /dev/stderr | grep -q '2026.20'
      - name: Test fishstringer-slang-emit
        shell: bash
        env:
          FISHSTRINGER_REQUIRE_SLANGC: "1"
        run: cargo test -p fishstringer-slang-emit --features convert

  # No toolchain needed: the compile script parses, its manifest is consistent with the sources on disk, and the
  # SPIR-V post-processing helper's characterisation tests pass.
  kernels-source:
    name: fishstringer-kernels-source (manifest, scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fishstringer-kernels-source/kernels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: compile.sh parses
        run: bash -n compile.sh
      - name: Manifest is one row per output, no duplicate output names, and covers every source
        run: |
          set -euo pipefail
          bash compile.sh --print-manifest > "$RUNNER_TEMP/manifest.tsv"
          test -s "$RUNNER_TEMP/manifest.tsv"
          dups="$(cut -f3 "$RUNNER_TEMP/manifest.tsv" | sort | uniq -d)"
          if [ -n "$dups" ]; then echo "duplicate outputs:" "$dups" >&2; exit 1; fi
          for f in *.slang; do
            cut -f1 "$RUNNER_TEMP/manifest.tsv" | grep -qxF "$f" || { echo "not in manifest: $f" >&2; exit 1; }
          done
      - name: hoist_extinst_imports characterisation tests
        run: python3 -m unittest test_hoist_extinst_imports
      - name: no_contraction path-check tests
        run: python3 -m unittest test_no_contraction

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  # Advisory only (CireSnave 2026-10-23): not a required check.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@30e012b7d400b10d88c1e294bd485e49975afc1e
